<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.25" stop-color="#ff9500"/>
      <stop offset="0.5" stop-color="#34c759"/>
      <stop offset="0.75" stop-color="#5ac8fa"/>
      <stop offset="1" stop-color="#af52de"/>
    </linearGradient>
  </defs>

  <!-- popover panel (dark theme) -->
  <rect x="8" y="8" width="680" height="376" rx="12" fill="#201b2c" stroke="#8c82a0" stroke-opacity="0.35"/>

  <!-- ── header ─────────────────────────────────────────────── -->
  <!-- wizard-hat logo -->
  <polygon points="24,34 40,34 34,18" fill="#a371f7"/>
  <ellipse cx="32" cy="34" rx="11" ry="3" fill="#a371f7" opacity="0.7"/>
  <text x="50" y="36" font-size="15" font-weight="700" fill="#ece9f2">m<tspan fill="#facc15">AI</tspan>estro</text>
  <!-- eye (show hidden) -->
  <g stroke="#a39db5" fill="none" stroke-width="1.4">
    <path d="M622 29 q8 -7 16 0 q-8 7 -16 0 z"/>
    <circle cx="630" cy="29" r="2.2" fill="#a39db5" stroke="none"/>
  </g>
  <!-- gear (settings) -->
  <g stroke="#a39db5" fill="none" stroke-width="1.4">
    <circle cx="662" cy="29" r="4.6"/>
    <g stroke-width="1.6">
      <line x1="662" y1="21.5" x2="662" y2="24"/><line x1="662" y1="34" x2="662" y2="36.5"/>
      <line x1="654.5" y1="29" x2="657" y2="29"/><line x1="667" y1="29" x2="669.5" y2="29"/>
      <line x1="656.7" y1="23.7" x2="658.5" y2="25.5"/><line x1="665.5" y1="32.5" x2="667.3" y2="34.3"/>
      <line x1="667.3" y1="23.7" x2="665.5" y2="25.5"/><line x1="658.5" y1="32.5" x2="656.7" y2="34.3"/>
    </g>
  </g>
  <line x1="16" y1="46" x2="680" y2="46" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- ── repo group: acme/webapp ────────────────────────────── -->
  <text x="24" y="72" font-size="13" font-weight="600" fill="#ece9f2">acme/webapp</text>
  <text x="512" y="72" font-size="11" fill="#a39db5">&lt;/&gt;</text>
  <rect x="548" y="56" width="88" height="24" rx="7" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.28"/>
  <text x="592" y="72" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">Start Work</text>
  <path d="M656 62 l5 6 l-5 6" stroke="#a39db5" stroke-width="1.5" fill="none"/>

  <!-- zone: Planning -->
  <circle cx="28" cy="94" r="3" fill="#a39db5"/>
  <text x="38" y="98" font-size="10.5" font-weight="600" fill="#a39db5" letter-spacing="0.4">Planning</text>
  <text x="92" y="98" font-size="10" fill="#a39db5">1</text>

  <!-- workspace row: working -->
  <rect x="16" y="104" width="664" height="30" rx="7" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="16" y="104" width="3" height="30" rx="1.5" fill="#a371f7"/>
  <rect x="30" y="109" width="78" height="20" rx="10" fill="none" stroke="url(#rainbow)" stroke-width="1.4"/>
  <g stroke="#ece9f2" stroke-width="1.3">
    <line x1="41" y1="115" x2="41" y2="123"/><line x1="37" y1="119" x2="45" y2="119"/>
    <line x1="38.2" y1="116.2" x2="43.8" y2="121.8"/><line x1="43.8" y1="116.2" x2="38.2" y2="121.8"/>
  </g>
  <text x="52" y="123" font-size="11" fill="#ece9f2">Working</text>
  <text x="120" y="123" font-size="12" fill="#ece9f2">#61 — Fix login retry flake</text>
  <g fill="#a39db5" font-size="11">
    <circle cx="534" cy="119" r="4.6" fill="none" stroke="#a39db5" stroke-width="1.3"/>
    <text x="544" y="123">#61</text>
    <path d="M578 114 h6 l2 2.5 h8 v9 h-16 z" fill="none" stroke="#a39db5" stroke-width="1.3"/>
    <text x="612" y="123">&lt;/&gt;</text>
  </g>
  <path d="M654 113 l5 6 l-5 6" stroke="#a39db5" stroke-width="1.5" fill="none"/>

  <!-- zone: Implementing -->
  <circle cx="28" cy="150" r="3" fill="#a39db5"/>
  <text x="38" y="154" font-size="10.5" font-weight="600" fill="#a39db5" letter-spacing="0.4">Implementing</text>
  <text x="118" y="154" font-size="10" fill="#a39db5">1</text>

  <!-- workspace row: needs you, commands open -->
  <rect x="16" y="160" width="664" height="30" rx="7" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="16" y="160" width="3" height="30" rx="1.5" fill="#60a5fa"/>
  <rect x="30" y="165" width="88" height="20" rx="10" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.28"/>
  <g stroke="#facc15" stroke-width="1.3">
    <line x1="41" y1="171" x2="41" y2="179"/><line x1="37" y1="175" x2="45" y2="175"/>
    <line x1="38.2" y1="172.2" x2="43.8" y2="177.8"/><line x1="43.8" y1="172.2" x2="38.2" y2="177.8"/>
  </g>
  <text x="52" y="179" font-size="11" fill="#facc15">Needs you</text>
  <text x="130" y="179" font-size="12" fill="#ece9f2">#57 — Dark theme for settings</text>
  <!-- PR pill with checks dot -->
  <g stroke="#60a5fa" stroke-width="1.3" fill="none">
    <circle cx="474" cy="171.5" r="2.6"/><circle cx="484" cy="182.5" r="2.6"/>
    <path d="M474 174 v6 q0 2.5 2.5 2.5 h4.5"/>
  </g>
  <text x="492" y="179" font-size="11" fill="#60a5fa">#58</text>
  <circle cx="514" cy="175" r="3" fill="#4ade80"/>
  <g fill="#a39db5" font-size="11">
    <circle cx="534" cy="175" r="4.6" fill="none" stroke="#a39db5" stroke-width="1.3"/>
    <text x="544" y="179">#57</text>
    <path d="M578 170 h6 l2 2.5 h8 v9 h-16 z" fill="none" stroke="#a39db5" stroke-width="1.3"/>
    <text x="612" y="179">&lt;/&gt;</text>
  </g>
  <path d="M653 172 l6 5 l-6 5" stroke="#a39db5" stroke-width="1.5" fill="none" transform="rotate(90 656 177)"/>

  <!-- command strip -->
  <g font-size="11" text-anchor="middle">
    <rect x="16" y="196" width="160" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="96" y="213" fill="#ece9f2">Create PR</text>
    <rect x="184" y="196" width="160" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="264" y="213" fill="#ece9f2">Merge PR</text>
    <rect x="352" y="196" width="160" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="432" y="213" fill="#ece9f2">Hide…</text>
    <rect x="520" y="196" width="160" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="600" y="213" fill="#ece9f2">Tear Down</text>
  </g>

  <!-- zone: Merged -->
  <circle cx="28" cy="238" r="3" fill="#a39db5"/>
  <text x="38" y="242" font-size="10.5" font-weight="600" fill="#a39db5" letter-spacing="0.4">Merged</text>
  <text x="86" y="242" font-size="10" fill="#a39db5">1</text>

  <!-- workspace row: idle, merged PR -->
  <rect x="16" y="248" width="664" height="30" rx="7" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="16" y="248" width="3" height="30" rx="1.5" fill="#4ade80"/>
  <rect x="30" y="253" width="56" height="20" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <g stroke="#a39db5" stroke-width="1.3">
    <line x1="41" y1="259" x2="41" y2="267"/><line x1="37" y1="263" x2="45" y2="263"/>
    <line x1="38.2" y1="260.2" x2="43.8" y2="265.8"/><line x1="43.8" y1="260.2" x2="38.2" y2="265.8"/>
  </g>
  <text x="52" y="267" font-size="11" fill="#a39db5">Idle</text>
  <text x="98" y="267" font-size="12" fill="#ece9f2">#42 — Release automation</text>
  <g stroke="#a371f7" stroke-width="1.3" fill="none">
    <circle cx="474" cy="259.5" r="2.6"/><circle cx="484" cy="270.5" r="2.6"/>
    <path d="M474 262 v6 q0 2.5 2.5 2.5 h4.5"/>
  </g>
  <text x="492" y="267" font-size="11" fill="#a371f7">#43</text>
  <g fill="#a39db5" font-size="11">
    <circle cx="534" cy="263" r="4.6" fill="none" stroke="#a39db5" stroke-width="1.3"/>
    <text x="544" y="267">#42</text>
    <path d="M578 258 h6 l2 2.5 h8 v9 h-16 z" fill="none" stroke="#a39db5" stroke-width="1.3"/>
    <text x="612" y="267">&lt;/&gt;</text>
  </g>
  <path d="M654 257 l5 6 l-5 6" stroke="#a39db5" stroke-width="1.5" fill="none"/>

  <!-- ── repo group: acme/api ───────────────────────────────── -->
  <line x1="16" y1="294" x2="680" y2="294" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="24" y="322" font-size="13" font-weight="600" fill="#ece9f2">acme/api</text>
  <text x="512" y="322" font-size="11" fill="#a39db5">&lt;/&gt;</text>
  <rect x="548" y="306" width="88" height="24" rx="7" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.28"/>
  <text x="592" y="322" font-size="12" font-weight="600" fill="#facc15" text-anchor="middle">Start Work</text>
  <path d="M656 312 l5 6 l-5 6" stroke="#a39db5" stroke-width="1.5" fill="none"/>
  <text x="24" y="352" font-size="11" font-style="italic" fill="#a39db5">No active work</text>

  <!-- ── numbered callouts ──────────────────────────────────── -->
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <circle cx="610" cy="14" r="8" fill="#facc15"/><text x="610" y="17.7" fill="#1c1826">1</text>
    <circle cx="14" cy="60" r="8" fill="#facc15"/><text x="14" y="63.7" fill="#1c1826">2</text>
    <circle cx="546" cy="52" r="8" fill="#facc15"/><text x="546" y="55.7" fill="#1c1826">3</text>
    <circle cx="28" cy="104" r="8" fill="#facc15"/><text x="28" y="107.7" fill="#1c1826">4</text>
    <circle cx="112" cy="94" r="8" fill="#facc15"/><text x="112" y="97.7" fill="#1c1826">5</text>
    <circle cx="464" cy="160" r="8" fill="#facc15"/><text x="464" y="163.7" fill="#1c1826">6</text>
    <circle cx="600" cy="104" r="8" fill="#facc15"/><text x="600" y="107.7" fill="#1c1826">7</text>
    <circle cx="14" cy="196" r="8" fill="#facc15"/><text x="14" y="199.7" fill="#1c1826">8</text>
  </g>
</svg>
