<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- overlay panel (dark theme) -->
  <rect x="8" y="8" width="680" height="384" rx="12" fill="#201b2c" stroke="#8c82a0" stroke-opacity="0.35"/>

  <!-- ── header ─────────────────────────────────────────────── -->
  <text x="24" y="34" font-size="13" font-weight="600" fill="#ece9f2">Start Work — acme/webapp</text>
  <g stroke="#a39db5" stroke-width="1.5">
    <line x1="660" y1="24" x2="670" y2="34"/><line x1="670" y1="24" x2="660" y2="34"/>
  </g>
  <line x1="16" y1="46" x2="680" y2="46" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- ── idea box ───────────────────────────────────────────── -->
  <rect x="16" y="56" width="664" height="30" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="26" y="75" font-size="12" fill="#a39db5" font-style="italic">Write your own idea…</text>
  <g font-size="11" text-anchor="middle">
    <rect x="16" y="94" width="96" height="24" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="64" y="110" fill="#ece9f2">Create Issue</text>
    <rect x="120" y="94" width="160" height="24" rx="7" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-opacity="0.32"/>
    <text x="200" y="110" fill="#facc15" font-weight="600">Create Issue and Spawn</text>
    <rect x="288" y="94" width="64" height="24" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="320" y="110" fill="#ece9f2">Cancel</text>
  </g>

  <!-- ── issue list toolbar ─────────────────────────────────── -->
  <text x="24" y="146" font-size="10.5" font-weight="600" fill="#a39db5" letter-spacing="0.4">Open issues</text>
  <rect x="596" y="130" width="84" height="22" rx="7" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.28"/>
  <text x="638" y="145" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">↻ Refresh</text>

  <!-- issue row (collapsed) -->
  <text x="24" y="176" font-size="12" fill="#ece9f2">#61  Fix login retry flake</text>
  <path d="M666 165 l5 6 l-5 6" stroke="#a39db5" stroke-width="1.5" fill="none"/>

  <!-- issue row (expanded → spawn preview) -->
  <rect x="16" y="188" width="664" height="30" rx="7" fill="#ffffff" fill-opacity="0.05"/>
  <text x="24" y="207" font-size="12" fill="#ece9f2">#57  Dark theme for settings</text>
  <path d="M663 197 l6 5 l-6 5" stroke="#a39db5" stroke-width="1.5" fill="none" transform="rotate(90 666 202)"/>

  <g>
    <text x="32" y="236" font-size="10.5" font-weight="600" fill="#a39db5">Session</text>
    <rect x="32" y="242" width="320" height="26" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="42" y="259" font-size="12" fill="#ece9f2">dark-theme-settings</text>

    <g font-size="11">
      <text x="32" y="288" fill="#a39db5">Session</text>
      <rect x="96" y="279" width="10" height="10" rx="3" fill="#a371f7"/>
      <text x="112" y="288" fill="#ece9f2">#57 — dark-theme-settings</text>
      <text x="32" y="306" fill="#a39db5">Branch</text>
      <text x="96" y="306" fill="#ece9f2">feature/57-dark-theme-settings</text>
      <text x="32" y="324" fill="#a39db5">Worktree</text>
      <text x="96" y="324" fill="#ece9f2">~/src/work-57-dark-theme-settings/webapp</text>
    </g>

    <g font-size="11" text-anchor="middle">
      <rect x="32" y="338" width="100" height="26" rx="7" fill="#facc15" fill-opacity="0.16" stroke="#facc15" stroke-opacity="0.32"/>
      <text x="82" y="355" fill="#facc15" font-weight="600">Spawn Work</text>
      <rect x="140" y="338" width="64" height="26" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="172" y="355" fill="#ece9f2">Cancel</text>
    </g>
  </g>

  <!-- issue row already being worked on -->
  <text x="24" y="386" font-size="12" fill="#a39db5">#42  Release automation</text>
  <rect x="560" y="372" width="64" height="18" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="592" y="384.5" font-size="10.5" fill="#a39db5" text-anchor="middle">Merged</text>

  <!-- ── numbered callouts ──────────────────────────────────── -->
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <circle cx="14" cy="56" r="8" fill="#facc15"/><text x="14" y="59.7" fill="#1c1826">1</text>
    <circle cx="14" cy="94" r="8" fill="#facc15"/><text x="14" y="97.7" fill="#1c1826">2</text>
    <circle cx="594" cy="128" r="8" fill="#facc15"/><text x="594" y="131.7" fill="#1c1826">3</text>
    <circle cx="14" cy="188" r="8" fill="#facc15"/><text x="14" y="191.7" fill="#1c1826">4</text>
    <circle cx="30" cy="338" r="8" fill="#facc15"/><text x="30" y="341.7" fill="#1c1826">5</text>
  </g>
</svg>
