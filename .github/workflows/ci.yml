# CI — runs on every pull request and on pushes to main.
#
# Two jobs: frontend (typecheck + vitest) on ubuntu, and backend (cargo test +
# clippy) on macos-latest — the backend is a Tauri/objc crate that only builds
# on macOS. Actions minutes are unmetered on public repos, so both run in CI
# (see issue #122); on a private repo macOS minutes bill at 10×, which is why
# the backend job was previously a local-only gate (see issue #111). This
# workflow is the natural enforcement point for the PR-only-main rule.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  backend:
    name: Backend (test + clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Tests
        working-directory: backend
        run: cargo test --locked

      - name: Clippy
        working-directory: backend
        run: cargo clippy --locked --all-targets -- -D warnings
